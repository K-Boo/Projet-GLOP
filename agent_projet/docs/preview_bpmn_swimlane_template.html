<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Apercu Composant — bpmn_swimlane_template</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/latin-modern-web@1.0.0/style.css">
  <style>
    /* ==========================================================================
   THEME MAITRE SHOPLOC — IDENTITE VISUELLE NORMALISEE
   Master 2 MIAGE — Universite de Lille — UE GLOP (2026-2027)
   Conforme RGAA AA / WCAG 2.1 — Charte Academique Sobrie et Zero Emoji
   ========================================================================== */

:root {
  /* 1. PALETTE DE COULEURS */
  --color-brand-primary: #0F2A4A;       /* Bleu institutionnel Universite de Lille */
  --color-brand-secondary: #6A1B29;     /* Bordeaux academique */
  --color-brand-accent: #1E3A8A;        /* Bleu saphir */

  --color-success: #166534;             /* Vert emeraude (Decisions validees MOA) */
  --color-success-bg: #F0FDF4;          /* Fond encart validation */
  --color-warning: #B45309;             /* Ambre / Ochre (Statuts en attente) */
  --color-warning-bg: #FFFBEB;          /* Fond encart en attente */
  --color-error: #991B1B;               /* Rouge sombre (Risques majeurs) */
  --color-error-bg: #FEF2F2;            /* Fond encart erreur */
  --color-info: #1E40AF;                /* Bleu informatif */
  --color-info-bg: #EFF6FF;             /* Fond encart informatif */

  --color-text-primary: #0F172A;        /* Gris ardoise fonce (> 12:1 sur blanc) */
  --color-text-secondary: #475569;      /* Gris ardoise moyen */
  --color-border-dark: #0F172A;         /* Bordure epaisse booktabs */
  --color-border-light: #CBD5E1;        /* Ligne de separation de cellules */
  --color-border-subtle: #E2E8F0;       /* Ligne decorative */

  --color-surface-card: #FFFFFF;
  --color-surface-page: #F8FAFC;
  --color-surface-print: #FFFFFF;

  /* PALETTE PASTEL ADOUCIE POUR LES DIAGRAMMES TECHNIQUES (BPMN, MCD, C4) */
  --diagram-system-bg: #E0F2FE;
  --diagram-system-border: #0284C7;
  --diagram-system-text: #0369A1;

  --diagram-citizen-bg: #DCFCE7;
  --diagram-citizen-border: #22C55E;
  --diagram-citizen-text: #15803D;

  --diagram-merchant-bg: #FFEDD5;
  --diagram-merchant-border: #F97316;
  --diagram-merchant-text: #C2410C;

  --diagram-partner-bg: #EDE9FE;
  --diagram-partner-border: #8B5CF6;
  --diagram-partner-text: #6D28D9;

  --diagram-alert-bg: #FEE2E2;
  --diagram-alert-border: #EF4444;
  --diagram-alert-text: #B91C1C;

  --diagram-lane-bg: #F8FAFC;
  --diagram-lane-border: #CBD5E1;

  /* 2. TYPOGRAPHIES */
  --font-serif: "Latin Modern Roman", "LM Roman 10", "Computer Modern", "TeX Gyre Termes", "Times New Roman", Times, serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Latin Modern Mono", "Fira Code", "Consolas", "Courier New", monospace;

  /* 3. ECHELLE DE TAILLES (DOCUMENT A4) */
  --font-size-title-main: 15pt;
  --font-size-wave: 12.5pt;
  --font-size-h2: 11.5pt;
  --font-size-h3: 10pt;
  --font-size-body: 9.5pt;
  --font-size-table: 9pt;
  --font-size-meta: 8.5pt;
  --font-size-micro: 7.5pt;

  /* 4. ESPACEMENTS & BORDURES */
  --line-height-normal: 1.38;
  --border-radius-sm: 2pt;
  --border-radius-md: 4pt;
}

/* CONFIGURATION DU RENDU IMPRESSION ET PAGE A4 */
@page {
  size: A4 portrait;
  margin: 24mm 20mm 24mm 20mm;

  @top-left {
    content: "Projet ShopLoc — Master 2 MIAGE GLOP";
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    font-style: italic;
    color: var(--color-text-secondary);
    border-bottom: 0.5pt solid var(--color-border-light);
    padding-bottom: 4pt;
    margin-bottom: 8pt;
  }

  @top-right {
    content: "Universite de Lille — FST Informatique";
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    font-style: italic;
    color: var(--color-text-secondary);
    border-bottom: 0.5pt solid var(--color-border-light);
    padding-bottom: 4pt;
    margin-bottom: 8pt;
  }

  @bottom-center {
    content: counter(page);
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    color: var(--color-text-primary);
  }
}

@page :first {
  @top-left { content: ""; border-bottom: none; }
  @top-right { content: ""; border-bottom: none; }
  @bottom-center { content: "1"; }
}

/* REGLES GENERALES */
*, *:before, *:after {
  box-sizing: border-box;
}

body {
  font-family: var(--font-serif);
  font-size: var(--font-size-body);
  line-height: var(--line-height-normal);
  color: var(--color-text-primary);
  background: var(--color-surface-print);
  margin: 0;
  padding: 0;
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
}

/* EN-TETE INSTITUTIONNEL AVEC LOGOS OFFICIELS */
.institution-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12pt;
  padding-bottom: 8pt;
  border-bottom: 0.75pt solid var(--color-brand-primary);
}

.institution-logo {
  height: 42px;
  max-width: 210px;
  object-fit: contain;
}

/* TITRAGE MAITRE */
.title-block {
  text-align: center;
  margin-top: 14pt;
  margin-bottom: 18pt;
}

.latex-main-title {
  font-size: var(--font-size-title-main);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
  margin: 0 0 6pt 0;
  line-height: 1.25;
}

.latex-sub-title {
  font-size: 11pt;
  font-style: italic;
  color: var(--color-brand-secondary);
  margin: 0 0 10pt 0;
}

/* BANNIERES DE GRANDES SECTIONS & H2 */
.wave-banner {
  font-size: var(--font-size-wave);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
  margin-top: 22pt;
  margin-bottom: 10pt;
  padding-bottom: 4pt;
  border-bottom: 1.5pt solid var(--color-brand-primary);
  page-break-after: avoid;
}

h2.section-heading {
  font-size: var(--font-size-h2);
  font-weight: bold;
  color: var(--color-brand-primary);
  margin-top: 16pt;
  margin-bottom: 6pt;
  padding-bottom: 2pt;
  border-bottom: 0.5pt solid var(--color-brand-secondary);
  page-break-after: avoid;
  text-align: left;
}

h3.subsection-heading {
  font-size: var(--font-size-h3);
  font-weight: bold;
  color: var(--color-text-primary);
  margin: 10pt 0 4pt 0;
  page-break-after: avoid;
  text-align: left;
}

/* TABLEAUX ACADEMIQUES FORMAT BOOKTABS */
.table-wrapper {
  margin: 8pt 0 14pt 0;
  width: 100%;
}

table.booktabs {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-table);
  line-height: 1.35;
  border-top: 1.5pt solid var(--color-border-dark);
  border-bottom: 1.5pt solid var(--color-border-dark);
  margin-bottom: 6pt;
}

table.booktabs th {
  font-weight: bold;
  text-align: left;
  padding: 5pt 7pt;
  border-bottom: 0.75pt solid var(--color-border-dark);
  background: transparent;
  color: var(--color-brand-primary);
}

table.booktabs td {
  padding: 4.5pt 7pt;
  vertical-align: top;
  border-bottom: 0.3pt solid var(--color-border-light);
  background: transparent;
}

table.booktabs tr:last-child td {
  border-bottom: none;
}

table.booktabs code {
  font-family: var(--font-mono);
  font-size: var(--font-size-meta);
  color: var(--color-brand-primary);
}

/* CARTOUCHE D'IDENTIFICATION OFFICIEL GLOP */
.cartouche-container {
  margin: 10pt 0 14pt 0;
}

.cartouche-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-table);
  border-top: 1.5pt solid var(--color-brand-primary);
  border-bottom: 1.5pt solid var(--color-brand-primary);
}

.cartouche-table th {
  width: 32%;
  padding: 4pt 6pt;
  text-align: left;
  font-weight: bold;
  color: var(--color-brand-primary);
  border-bottom: 0.5pt solid var(--color-border-light);
}

.cartouche-table td {
  width: 68%;
  padding: 4pt 6pt;
  border-bottom: 0.3pt solid var(--color-border-light);
}

.cartouche-table tr:last-child th,
.cartouche-table tr:last-child td {
  border-bottom: none;
}

/* ENCARTS ET DECISIONS VALIDATION / ATTENTE (ZERO BARRE LATERALE) */
.callout-box {
  margin: 6pt 0 6pt 0;
  padding: 6pt 10pt;
  border-radius: var(--border-radius-sm);
  font-size: var(--font-size-body);
  line-height: 1.45;
  page-break-inside: avoid;
}

.callout-success {
  background-color: var(--color-success-bg);
  color: var(--color-success);
}
.callout-success strong {
  color: var(--color-success);
}

.callout-warning {
  background-color: var(--color-warning-bg);
  color: var(--color-warning);
}
.callout-warning strong {
  color: var(--color-warning);
}

.callout-error {
  background-color: var(--color-error-bg);
  color: var(--color-error);
}
.callout-error strong {
  color: var(--color-error);
}

.callout-info {
  background-color: var(--color-info-bg);
  color: var(--color-info);
}
.callout-info strong {
  color: var(--color-info);
}

/* PREAMBULE ACADEMIQUE */
.abstract-box {
  margin: 12pt 20pt 16pt 20pt;
  padding: 6pt 12pt;
  border-top: 0.5pt solid var(--color-border-light);
  border-bottom: 0.5pt solid var(--color-border-light);
}

.abstract-title {
  font-size: var(--font-size-h3);
  font-weight: bold;
  text-align: center;
  margin-bottom: 4pt;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
}

.abstract-text {
  font-size: var(--font-size-table);
  font-style: italic;
  line-height: 1.35;
  margin: 0;
  text-align: justify;
}

/* BADGES ET METADONNEES EN LIGNE */
.badge {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: var(--font-size-micro);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 1.5pt 5pt;
  border-radius: var(--border-radius-sm);
  vertical-align: middle;
}

.badge-success { background: #DCFCE7; color: var(--color-success); }
.badge-warning { background: #FEF3C7; color: var(--color-warning); }
.badge-brand   { background: #DBEAFE; color: var(--color-brand-primary); }
.badge-neutral { background: #F1F5F9; color: var(--color-text-secondary); }

/* CONTENEURS POUR SCHEMAS ET DIAGRAMMES */
.diagram-container {
  margin: 12pt 0;
  padding: 8pt;
  background: #FFFFFF;
  border: 0.5pt solid var(--color-border-light);
  border-radius: var(--border-radius-md);
  text-align: center;
  page-break-inside: avoid;
}

.diagram-caption {
  font-size: var(--font-size-meta);
  font-style: italic;
  color: var(--color-text-secondary);
  margin-top: 4pt;
  text-align: center;
}

/* ELEMENTS D'EXPRESSION DE CODE ET REFERENCES */
code.latex-code {
  font-family: var(--font-mono);
  font-size: var(--font-size-meta);
  color: var(--color-brand-primary);
  background: transparent;
}

    body {
      max-width: 960px;
      margin: 30px auto;
      padding: 20px;
      background: #F8FAFC;
    }
  </style>
</head>
<body>
  <!-- GABARIT DE REFERENCE BPMN 2.0 A COULOIRS (SWIMLANES) EN SVG VECTORIEL PUR -->
<!-- Palette pastel adoucie conformement a l arbitrage de session -->

<div class="diagram-container" style="margin: 16pt 0; text-align: center;">
  <h3 style="font-size: 10.5pt; color: var(--color-brand-primary); margin-bottom: 8pt; text-transform: uppercase;">
    Figure 3.1 — Processus BPMN 2.0 : Commande Click & Collect et Retrait Magasin (Processus P2)
  </h3>

  <svg viewBox="0 0 920 460" width="100%" height="460" style="font-family: 'Inter', sans-serif;">
    <!-- DEFINITION DES MARQUEURS DE FLECHES -->
    <defs>
      <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
      </marker>
      <marker id="arrow-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
      </marker>
    </defs>

    <!-- CADRE GENERAL DU PROCESSUS (POOL SHOPLOC) -->
    <rect x="20" y="20" width="880" height="420" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5" />
    
    <!-- EN-TETE DU POOL -->
    <rect x="20" y="20" width="35" height="420" fill="#0F2A4A" />
    <text x="38" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" transform="rotate(-90 38 230)">
      PROCESSUS DE COMMANDE & RETRAIT CLICK & COLLECT
    </text>

    <!-- COULOIR 1 : CITOYEN / CLIENT (Vert pastel) -->
    <rect x="55" y="20" width="845" height="100" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75" />
    <rect x="55" y="20" width="120" height="100" fill="#DCFCE7" opacity="0.4" />
    <text x="65" y="75" font-size="10" font-weight="bold" fill="#15803D">1. Citoyen (Client)</text>

    <!-- COULOIR 2 : COEUR SHOPLOC (Bleu pastel) -->
    <rect x="55" y="120" width="845" height="110" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.75" />
    <rect x="55" y="120" width="120" height="110" fill="#E0F2FE" opacity="0.4" />
    <text x="65" y="180" font-size="10" font-weight="bold" fill="#0369A1">2. Plateforme ShopLoc</text>

    <!-- COULOIR 3 : COMMERCANT (Peche pastel) -->
    <rect x="55" y="230" width="845" height="105" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75" />
    <rect x="55" y="230" width="120" height="105" fill="#FFEDD5" opacity="0.4" />
    <text x="65" y="290" font-size="10" font-weight="bold" fill="#C2410C">3. Commerçant</text>

    <!-- COULOIR 4 : SERVICES PARTENAIRES (Lavande pastel) -->
    <rect x="55" y="335" width="845" height="105" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.75" />
    <rect x="55" y="335" width="120" height="105" fill="#EDE9FE" opacity="0.4" />
    <text x="65" y="395" font-size="10" font-weight="bold" fill="#6D28D9">4. Services Partenaires</text>

    <!-- FLUX BPMN 2.0 : ETAPES ET ACTIVITES -->

    <!-- Evenement Debut (Cercle fin vert pastel) -->
    <circle cx="205" cy="70" r="16" fill="#DCFCE7" stroke="#15803D" stroke-width="2" />
    <text x="205" y="100" text-anchor="middle" font-size="7.5" fill="#15803D">Panier valide</text>

    <!-- Sequence Citoyen -> ShopLoc -->
    <line x1="221" y1="70" x2="260" y2="70" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-solid)" />

    <!-- Tache 1 (Citoyen) : Choix du creneau de retrait -->
    <rect x="260" y="45" width="115" height="50" rx="6" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.2" />
    <text x="317" y="66" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803D">Selectionner les</text>
    <text x="317" y="80" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803D">creneaux de retrait</text>

    <!-- Ligne de sequence vers ShopLoc -->
    <path d="M 375 70 L 400 70 L 400 150 L 420 150" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-solid)" />

    <!-- Tache 2 (ShopLoc) : Reservation temporaire stock (2PC) -->
    <rect x="420" y="130" width="120" height="50" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2" />
    <text x="480" y="151" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0369A1">Verrouiller stock</text>
    <text x="480" y="165" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0369A1">& creer commande</text>

    <!-- Passerelle XOR : Stock disponible ? -->
    <polygon points="580,155 600,135 620,155 600,175" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
    <text x="600" y="159" text-anchor="middle" font-size="10" font-weight="bold" fill="#B45309">X</text>
    <line x1="540" y1="155" x2="580" y2="155" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-solid)" />

    <!-- Branche Rejet (Haut / Droite) : Rupture de stock -->
    <path d="M 600 135 L 600 70 L 680 70" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-solid)" />
    <text x="635" y="63" font-size="7.5" font-weight="bold" fill="#DC2626">[Stock epuise]</text>
    <rect x="680" y="45" width="105" height="50" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2" />
    <text x="732" y="66" text-anchor="middle" font-size="8" font-weight="600" fill="#B91C1C">Notifier client</text>
    <text x="732" y="80" text-anchor="middle" font-size="8" font-weight="600" fill="#B91C1C">& liberer panier</text>
    <!-- Fin Rejet -->
    <circle cx="830" cy="70" r="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3" />
    <line x1="785" y1="70" x2="816" y2="70" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-solid)" />

    <!-- Branche OK : Descente vers Commercant -->
    <path d="M 600 175 L 600 280 L 630 280" fill="none" stroke="#166534" stroke-width="1.5" marker-end="url(#arrow-solid)" />
    <text x="608" y="225" font-size="7.5" font-weight="bold" fill="#166534">[Disponible]</text>

    <!-- Tache 3 (Commercant) : Preparation paquet & Scan QR retrait -->
    <rect x="630" y="255" width="125" height="50" rx="6" fill="#FFEDD5" stroke="#F97316" stroke-width="1.2" />
    <text x="692" y="276" text-anchor="middle" font-size="8.5" font-weight="600" fill="#C2410C">Preparer commande</text>
    <text x="692" y="290" text-anchor="middle" font-size="8.5" font-weight="600" fill="#C2410C">& scanner retrait</text>

    <!-- Notification vers Services Mobilites (Descente vers Couloir 4) -->
    <path d="M 692 305 L 692 385 L 720 385" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-msg)" />

    <!-- Tache 4 (Services Partenaires) : Crediter passage VFP et verifier seuil mobilite -->
    <rect x="720" y="360" width="120" height="50" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2" />
    <text x="780" y="381" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6D28D9">Incrementer VFP</text>
    <text x="780" y="395" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6D28D9">& mock transport</text>

    <!-- Fin Nominale (Cercle epais vert) -->
    <circle cx="875" cy="385" r="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3" />
    <line x1="840" y1="385" x2="861" y2="385" stroke="#15803D" stroke-width="1.5" marker-end="url(#arrow-solid)" />
  </svg>
</div>

</body>
</html>
