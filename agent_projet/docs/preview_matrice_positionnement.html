<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Apercu Composant — matrice_positionnement</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/latin-modern-web@1.0.0/style.css">
  <style>
    /* ==========================================================================
   THEME MAITRE SHOPLOC — IDENTITE VISUELLE NORMALISEE
   Master 2 MIAGE — Universite de Lille — UE GLOP (2026-2027)
   Conforme RGAA AA / WCAG 2.1 — Charte Academique Sobrie et Zero Emoji
   ========================================================================== */

:root {
  /* 1. PALETTE DE COULEURS */
  --color-brand-primary: #0F2A4A;       /* Bleu institutionnel Universite de Lille */
  --color-brand-secondary: #6A1B29;     /* Bordeaux academique */
  --color-brand-accent: #1E3A8A;        /* Bleu saphir */

  --color-success: #166534;             /* Vert emeraude (Decisions validees MOA) */
  --color-success-bg: #F0FDF4;          /* Fond encart validation */
  --color-warning: #B45309;             /* Ambre / Ochre (Statuts en attente) */
  --color-warning-bg: #FFFBEB;          /* Fond encart en attente */
  --color-error: #991B1B;               /* Rouge sombre (Risques majeurs) */
  --color-error-bg: #FEF2F2;            /* Fond encart erreur */
  --color-info: #1E40AF;                /* Bleu informatif */
  --color-info-bg: #EFF6FF;             /* Fond encart informatif */

  --color-text-primary: #0F172A;        /* Gris ardoise fonce (> 12:1 sur blanc) */
  --color-text-secondary: #475569;      /* Gris ardoise moyen */
  --color-border-dark: #0F172A;         /* Bordure epaisse booktabs */
  --color-border-light: #CBD5E1;        /* Ligne de separation de cellules */
  --color-border-subtle: #E2E8F0;       /* Ligne decorative */

  --color-surface-card: #FFFFFF;
  --color-surface-page: #F8FAFC;
  --color-surface-print: #FFFFFF;

  /* PALETTE PASTEL ADOUCIE POUR LES DIAGRAMMES TECHNIQUES (BPMN, MCD, C4) */
  --diagram-system-bg: #E0F2FE;
  --diagram-system-border: #0284C7;
  --diagram-system-text: #0369A1;

  --diagram-citizen-bg: #DCFCE7;
  --diagram-citizen-border: #22C55E;
  --diagram-citizen-text: #15803D;

  --diagram-merchant-bg: #FFEDD5;
  --diagram-merchant-border: #F97316;
  --diagram-merchant-text: #C2410C;

  --diagram-partner-bg: #EDE9FE;
  --diagram-partner-border: #8B5CF6;
  --diagram-partner-text: #6D28D9;

  --diagram-alert-bg: #FEE2E2;
  --diagram-alert-border: #EF4444;
  --diagram-alert-text: #B91C1C;

  --diagram-lane-bg: #F8FAFC;
  --diagram-lane-border: #CBD5E1;

  /* 2. TYPOGRAPHIES */
  --font-serif: "Latin Modern Roman", "LM Roman 10", "Computer Modern", "TeX Gyre Termes", "Times New Roman", Times, serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Latin Modern Mono", "Fira Code", "Consolas", "Courier New", monospace;

  /* 3. ECHELLE DE TAILLES (DOCUMENT A4) */
  --font-size-title-main: 15pt;
  --font-size-wave: 12.5pt;
  --font-size-h2: 11.5pt;
  --font-size-h3: 10pt;
  --font-size-body: 9.5pt;
  --font-size-table: 9pt;
  --font-size-meta: 8.5pt;
  --font-size-micro: 7.5pt;

  /* 4. ESPACEMENTS & BORDURES */
  --line-height-normal: 1.38;
  --border-radius-sm: 2pt;
  --border-radius-md: 4pt;
}

/* CONFIGURATION DU RENDU IMPRESSION ET PAGE A4 */
@page {
  size: A4 portrait;
  margin: 24mm 20mm 24mm 20mm;

  @top-left {
    content: "Projet ShopLoc — Master 2 MIAGE GLOP";
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    font-style: italic;
    color: var(--color-text-secondary);
    border-bottom: 0.5pt solid var(--color-border-light);
    padding-bottom: 4pt;
    margin-bottom: 8pt;
  }

  @top-right {
    content: "Universite de Lille — FST Informatique";
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    font-style: italic;
    color: var(--color-text-secondary);
    border-bottom: 0.5pt solid var(--color-border-light);
    padding-bottom: 4pt;
    margin-bottom: 8pt;
  }

  @bottom-center {
    content: counter(page);
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    color: var(--color-text-primary);
  }
}

@page :first {
  @top-left { content: ""; border-bottom: none; }
  @top-right { content: ""; border-bottom: none; }
  @bottom-center { content: "1"; }
}

/* REGLES GENERALES */
*, *:before, *:after {
  box-sizing: border-box;
}

body {
  font-family: var(--font-serif);
  font-size: var(--font-size-body);
  line-height: var(--line-height-normal);
  color: var(--color-text-primary);
  background: var(--color-surface-print);
  margin: 0;
  padding: 0;
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
}

/* EN-TETE INSTITUTIONNEL AVEC LOGOS OFFICIELS */
.institution-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12pt;
  padding-bottom: 8pt;
  border-bottom: 0.75pt solid var(--color-brand-primary);
}

.institution-logo {
  height: 42px;
  max-width: 210px;
  object-fit: contain;
}

/* TITRAGE MAITRE */
.title-block {
  text-align: center;
  margin-top: 14pt;
  margin-bottom: 18pt;
}

.latex-main-title {
  font-size: var(--font-size-title-main);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
  margin: 0 0 6pt 0;
  line-height: 1.25;
}

.latex-sub-title {
  font-size: 11pt;
  font-style: italic;
  color: var(--color-brand-secondary);
  margin: 0 0 10pt 0;
}

/* BANNIERES DE GRANDES SECTIONS & H2 */
.wave-banner {
  font-size: var(--font-size-wave);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
  margin-top: 22pt;
  margin-bottom: 10pt;
  padding-bottom: 4pt;
  border-bottom: 1.5pt solid var(--color-brand-primary);
  page-break-after: avoid;
}

h2.section-heading {
  font-size: var(--font-size-h2);
  font-weight: bold;
  color: var(--color-brand-primary);
  margin-top: 16pt;
  margin-bottom: 6pt;
  padding-bottom: 2pt;
  border-bottom: 0.5pt solid var(--color-brand-secondary);
  page-break-after: avoid;
  text-align: left;
}

h3.subsection-heading {
  font-size: var(--font-size-h3);
  font-weight: bold;
  color: var(--color-text-primary);
  margin: 10pt 0 4pt 0;
  page-break-after: avoid;
  text-align: left;
}

/* TABLEAUX ACADEMIQUES FORMAT BOOKTABS */
.table-wrapper {
  margin: 8pt 0 14pt 0;
  width: 100%;
}

table.booktabs {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-table);
  line-height: 1.35;
  border-top: 1.5pt solid var(--color-border-dark);
  border-bottom: 1.5pt solid var(--color-border-dark);
  margin-bottom: 6pt;
}

table.booktabs th {
  font-weight: bold;
  text-align: left;
  padding: 5pt 7pt;
  border-bottom: 0.75pt solid var(--color-border-dark);
  background: transparent;
  color: var(--color-brand-primary);
}

table.booktabs td {
  padding: 4.5pt 7pt;
  vertical-align: top;
  border-bottom: 0.3pt solid var(--color-border-light);
  background: transparent;
}

table.booktabs tr:last-child td {
  border-bottom: none;
}

table.booktabs code {
  font-family: var(--font-mono);
  font-size: var(--font-size-meta);
  color: var(--color-brand-primary);
}

/* CARTOUCHE D'IDENTIFICATION OFFICIEL GLOP */
.cartouche-container {
  margin: 10pt 0 14pt 0;
}

.cartouche-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-table);
  border-top: 1.5pt solid var(--color-brand-primary);
  border-bottom: 1.5pt solid var(--color-brand-primary);
}

.cartouche-table th {
  width: 32%;
  padding: 4pt 6pt;
  text-align: left;
  font-weight: bold;
  color: var(--color-brand-primary);
  border-bottom: 0.5pt solid var(--color-border-light);
}

.cartouche-table td {
  width: 68%;
  padding: 4pt 6pt;
  border-bottom: 0.3pt solid var(--color-border-light);
}

.cartouche-table tr:last-child th,
.cartouche-table tr:last-child td {
  border-bottom: none;
}

/* ENCARTS ET DECISIONS VALIDATION / ATTENTE (ZERO BARRE LATERALE) */
.callout-box {
  margin: 6pt 0 6pt 0;
  padding: 6pt 10pt;
  border-radius: var(--border-radius-sm);
  font-size: var(--font-size-body);
  line-height: 1.45;
  page-break-inside: avoid;
}

.callout-success {
  background-color: var(--color-success-bg);
  color: var(--color-success);
}
.callout-success strong {
  color: var(--color-success);
}

.callout-warning {
  background-color: var(--color-warning-bg);
  color: var(--color-warning);
}
.callout-warning strong {
  color: var(--color-warning);
}

.callout-error {
  background-color: var(--color-error-bg);
  color: var(--color-error);
}
.callout-error strong {
  color: var(--color-error);
}

.callout-info {
  background-color: var(--color-info-bg);
  color: var(--color-info);
}
.callout-info strong {
  color: var(--color-info);
}

/* PREAMBULE ACADEMIQUE */
.abstract-box {
  margin: 12pt 20pt 16pt 20pt;
  padding: 6pt 12pt;
  border-top: 0.5pt solid var(--color-border-light);
  border-bottom: 0.5pt solid var(--color-border-light);
}

.abstract-title {
  font-size: var(--font-size-h3);
  font-weight: bold;
  text-align: center;
  margin-bottom: 4pt;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
}

.abstract-text {
  font-size: var(--font-size-table);
  font-style: italic;
  line-height: 1.35;
  margin: 0;
  text-align: justify;
}

/* BADGES ET METADONNEES EN LIGNE */
.badge {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: var(--font-size-micro);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 1.5pt 5pt;
  border-radius: var(--border-radius-sm);
  vertical-align: middle;
}

.badge-success { background: #DCFCE7; color: var(--color-success); }
.badge-warning { background: #FEF3C7; color: var(--color-warning); }
.badge-brand   { background: #DBEAFE; color: var(--color-brand-primary); }
.badge-neutral { background: #F1F5F9; color: var(--color-text-secondary); }

/* CONTENEURS POUR SCHEMAS ET DIAGRAMMES */
.diagram-container {
  margin: 12pt 0;
  padding: 8pt;
  background: #FFFFFF;
  border: 0.5pt solid var(--color-border-light);
  border-radius: var(--border-radius-md);
  text-align: center;
  page-break-inside: avoid;
}

.diagram-caption {
  font-size: var(--font-size-meta);
  font-style: italic;
  color: var(--color-text-secondary);
  margin-top: 4pt;
  text-align: center;
}

/* ELEMENTS D'EXPRESSION DE CODE ET REFERENCES */
code.latex-code {
  font-family: var(--font-mono);
  font-size: var(--font-size-meta);
  color: var(--color-brand-primary);
  background: transparent;
}

    body {
      max-width: 960px;
      margin: 30px auto;
      padding: 20px;
      background: #F8FAFC;
    }
  </style>
</head>
<body>
  <!-- MATRICE DE POSITIONNEMENT CONCURRENTIEL (2 AXES STRATEGIQUES) -->
<div class="diagram-container" style="margin: 16pt 0; text-align: center;">
  <h3 style="font-size: 10pt; color: var(--color-brand-primary); margin-bottom: 8pt; text-transform: uppercase;">
    Figure 1.3 — Matrice de Positionnement Strategique (2 Axes)
  </h3>

  <svg viewBox="0 0 650 380" width="100%" height="380" style="font-family: 'Inter', sans-serif;">
    <!-- Arriere-plan 4 quadrants -->
    <rect x="50" y="30" width="270" height="150" fill="#F8FAFC" />
    <rect x="330" y="30" width="270" height="150" fill="#F0FDF4" /> <!-- Quadrant cible ShopLoc -->
    <rect x="50" y="190" width="270" height="150" fill="#FEF2F2" />
    <rect x="330" y="190" width="270" height="150" fill="#FFFBEB" />

    <!-- Axe Horizontal (X) : Ancrage territorial -->
    <line x1="40" y1="185" x2="610" y2="185" stroke="#0F2A4A" stroke-width="2" />
    <polygon points="615,185 605,180 605,190" fill="#0F2A4A" />
    <text x="50" y="175" font-size="9" fill="#64748B">Delocalise / Livraison motorisee</text>
    <text x="600" y="175" text-anchor="end" font-size="9" font-weight="bold" fill="#0F2A4A">Ancrage physique / Flux pietonnier en centre-ville (+)</text>

    <!-- Axe Vertical (Y) : Modele economique -->
    <line x1="325" y1="360" x2="325" y2="20" stroke="#0F2A4A" stroke-width="2" />
    <polygon points="325,15 320,25 330,25" fill="#0F2A4A" />
    <text x="335" y="25" font-size="9" font-weight="bold" fill="#0F2A4A">Gratuite citoyenne & Souverainete publique (+)</text>
    <text x="335" y="355" font-size="9" fill="#64748B">Commissions predatrices sur CA marchand (-)</text>

    <!-- POSITIONNEMENT DES ACTEURS -->

    <!-- Acteur 1 : ShopLoc (Cible ideale : Haut Droite) -->
    <rect x="420" y="65" width="160" height="60" rx="6" fill="#0F2A4A" stroke="#166534" stroke-width="2" />
    <text x="500" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Plateforme ShopLoc</text>
    <text x="500" y="108" text-anchor="middle" font-size="8" fill="#86EFAC">Flux physique & Souverainete</text>

    <!-- Acteur 2 : Geants du E-Commerce (Bas Gauche : Amazon, etc.) -->
    <rect x="70" y="240" width="150" height="50" rx="4" fill="#FFFFFF" stroke="#991B1B" stroke-width="1.5" />
    <text x="145" y="262" text-anchor="middle" font-size="10" font-weight="bold" fill="#991B1B">Marketplaces Globales</text>
    <text x="145" y="278" text-anchor="middle" font-size="7.5" fill="#64748B">Livraison domicile & Commissions</text>

    <!-- Acteur 3 : Plateformes de livraison repas (Bas Droite : Deliveroo, UberEats) -->
    <rect x="360" y="250" width="150" height="50" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2" />
    <text x="435" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#B45309">Plateformes de Livraison</text>
    <text x="435" y="288" text-anchor="middle" font-size="7.5" fill="#64748B">Commerces locaux mais forte com.</text>

    <!-- Acteur 4 : Solutions de carte de fidelite locales isolees (Haut Gauche) -->
    <rect x="90" y="75" width="150" height="50" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
    <text x="165" y="97" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">Programmes Prives Isolees</text>
    <text x="165" y="112" text-anchor="middle" font-size="7.5" fill="#64748B">Sans mutualisation urbaine</text>
  </svg>
</div>

</body>
</html>
