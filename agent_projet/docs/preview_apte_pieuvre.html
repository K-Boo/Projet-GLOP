<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Apercu Composant — apte_pieuvre</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/latin-modern-web@1.0.0/style.css">
  <style>
    /* ==========================================================================
   THEME MAITRE SHOPLOC — IDENTITE VISUELLE NORMALISEE
   Master 2 MIAGE — Universite de Lille — UE GLOP (2026-2027)
   Conforme RGAA AA / WCAG 2.1 — Charte Academique Sobrie et Zero Emoji
   ========================================================================== */

:root {
  /* 1. PALETTE DE COULEURS */
  --color-brand-primary: #0F2A4A;       /* Bleu institutionnel Universite de Lille */
  --color-brand-secondary: #6A1B29;     /* Bordeaux academique */
  --color-brand-accent: #1E3A8A;        /* Bleu saphir */

  --color-success: #166534;             /* Vert emeraude (Decisions validees MOA) */
  --color-success-bg: #F0FDF4;          /* Fond encart validation */
  --color-warning: #B45309;             /* Ambre / Ochre (Statuts en attente) */
  --color-warning-bg: #FFFBEB;          /* Fond encart en attente */
  --color-error: #991B1B;               /* Rouge sombre (Risques majeurs) */
  --color-error-bg: #FEF2F2;            /* Fond encart erreur */
  --color-info: #1E40AF;                /* Bleu informatif */
  --color-info-bg: #EFF6FF;             /* Fond encart informatif */

  --color-text-primary: #0F172A;        /* Gris ardoise fonce (> 12:1 sur blanc) */
  --color-text-secondary: #475569;      /* Gris ardoise moyen */
  --color-border-dark: #0F172A;         /* Bordure epaisse booktabs */
  --color-border-light: #CBD5E1;        /* Ligne de separation de cellules */
  --color-border-subtle: #E2E8F0;       /* Ligne decorative */

  --color-surface-card: #FFFFFF;
  --color-surface-page: #F8FAFC;
  --color-surface-print: #FFFFFF;

  /* PALETTE PASTEL ADOUCIE POUR LES DIAGRAMMES TECHNIQUES (BPMN, MCD, C4) */
  --diagram-system-bg: #E0F2FE;
  --diagram-system-border: #0284C7;
  --diagram-system-text: #0369A1;

  --diagram-citizen-bg: #DCFCE7;
  --diagram-citizen-border: #22C55E;
  --diagram-citizen-text: #15803D;

  --diagram-merchant-bg: #FFEDD5;
  --diagram-merchant-border: #F97316;
  --diagram-merchant-text: #C2410C;

  --diagram-partner-bg: #EDE9FE;
  --diagram-partner-border: #8B5CF6;
  --diagram-partner-text: #6D28D9;

  --diagram-alert-bg: #FEE2E2;
  --diagram-alert-border: #EF4444;
  --diagram-alert-text: #B91C1C;

  --diagram-lane-bg: #F8FAFC;
  --diagram-lane-border: #CBD5E1;

  /* 2. TYPOGRAPHIES */
  --font-serif: "Latin Modern Roman", "LM Roman 10", "Computer Modern", "TeX Gyre Termes", "Times New Roman", Times, serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Latin Modern Mono", "Fira Code", "Consolas", "Courier New", monospace;

  /* 3. ECHELLE DE TAILLES (DOCUMENT A4) */
  --font-size-title-main: 15pt;
  --font-size-wave: 12.5pt;
  --font-size-h2: 11.5pt;
  --font-size-h3: 10pt;
  --font-size-body: 9.5pt;
  --font-size-table: 9pt;
  --font-size-meta: 8.5pt;
  --font-size-micro: 7.5pt;

  /* 4. ESPACEMENTS & BORDURES */
  --line-height-normal: 1.38;
  --border-radius-sm: 2pt;
  --border-radius-md: 4pt;
}

/* CONFIGURATION DU RENDU IMPRESSION ET PAGE A4 */
@page {
  size: A4 portrait;
  margin: 24mm 20mm 24mm 20mm;

  @top-left {
    content: "Projet ShopLoc — Master 2 MIAGE GLOP";
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    font-style: italic;
    color: var(--color-text-secondary);
    border-bottom: 0.5pt solid var(--color-border-light);
    padding-bottom: 4pt;
    margin-bottom: 8pt;
  }

  @top-right {
    content: "Universite de Lille — FST Informatique";
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    font-style: italic;
    color: var(--color-text-secondary);
    border-bottom: 0.5pt solid var(--color-border-light);
    padding-bottom: 4pt;
    margin-bottom: 8pt;
  }

  @bottom-center {
    content: counter(page);
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    color: var(--color-text-primary);
  }
}

@page :first {
  @top-left { content: ""; border-bottom: none; }
  @top-right { content: ""; border-bottom: none; }
  @bottom-center { content: "1"; }
}

/* REGLES GENERALES */
*, *:before, *:after {
  box-sizing: border-box;
}

body {
  font-family: var(--font-serif);
  font-size: var(--font-size-body);
  line-height: var(--line-height-normal);
  color: var(--color-text-primary);
  background: var(--color-surface-print);
  margin: 0;
  padding: 0;
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
}

/* EN-TETE INSTITUTIONNEL AVEC LOGOS OFFICIELS */
.institution-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12pt;
  padding-bottom: 8pt;
  border-bottom: 0.75pt solid var(--color-brand-primary);
}

.institution-logo {
  height: 42px;
  max-width: 210px;
  object-fit: contain;
}

/* TITRAGE MAITRE */
.title-block {
  text-align: center;
  margin-top: 14pt;
  margin-bottom: 18pt;
}

.latex-main-title {
  font-size: var(--font-size-title-main);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
  margin: 0 0 6pt 0;
  line-height: 1.25;
}

.latex-sub-title {
  font-size: 11pt;
  font-style: italic;
  color: var(--color-brand-secondary);
  margin: 0 0 10pt 0;
}

/* BANNIERES DE GRANDES SECTIONS & H2 */
.wave-banner {
  font-size: var(--font-size-wave);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
  margin-top: 22pt;
  margin-bottom: 10pt;
  padding-bottom: 4pt;
  border-bottom: 1.5pt solid var(--color-brand-primary);
  page-break-after: avoid;
}

h2.section-heading {
  font-size: var(--font-size-h2);
  font-weight: bold;
  color: var(--color-brand-primary);
  margin-top: 16pt;
  margin-bottom: 6pt;
  padding-bottom: 2pt;
  border-bottom: 0.5pt solid var(--color-brand-secondary);
  page-break-after: avoid;
  text-align: left;
}

h3.subsection-heading {
  font-size: var(--font-size-h3);
  font-weight: bold;
  color: var(--color-text-primary);
  margin: 10pt 0 4pt 0;
  page-break-after: avoid;
  text-align: left;
}

/* TABLEAUX ACADEMIQUES FORMAT BOOKTABS */
.table-wrapper {
  margin: 8pt 0 14pt 0;
  width: 100%;
}

table.booktabs {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-table);
  line-height: 1.35;
  border-top: 1.5pt solid var(--color-border-dark);
  border-bottom: 1.5pt solid var(--color-border-dark);
  margin-bottom: 6pt;
}

table.booktabs th {
  font-weight: bold;
  text-align: left;
  padding: 5pt 7pt;
  border-bottom: 0.75pt solid var(--color-border-dark);
  background: transparent;
  color: var(--color-brand-primary);
}

table.booktabs td {
  padding: 4.5pt 7pt;
  vertical-align: top;
  border-bottom: 0.3pt solid var(--color-border-light);
  background: transparent;
}

table.booktabs tr:last-child td {
  border-bottom: none;
}

table.booktabs code {
  font-family: var(--font-mono);
  font-size: var(--font-size-meta);
  color: var(--color-brand-primary);
}

/* CARTOUCHE D'IDENTIFICATION OFFICIEL GLOP */
.cartouche-container {
  margin: 10pt 0 14pt 0;
}

.cartouche-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-table);
  border-top: 1.5pt solid var(--color-brand-primary);
  border-bottom: 1.5pt solid var(--color-brand-primary);
}

.cartouche-table th {
  width: 32%;
  padding: 4pt 6pt;
  text-align: left;
  font-weight: bold;
  color: var(--color-brand-primary);
  border-bottom: 0.5pt solid var(--color-border-light);
}

.cartouche-table td {
  width: 68%;
  padding: 4pt 6pt;
  border-bottom: 0.3pt solid var(--color-border-light);
}

.cartouche-table tr:last-child th,
.cartouche-table tr:last-child td {
  border-bottom: none;
}

/* ENCARTS ET DECISIONS VALIDATION / ATTENTE (ZERO BARRE LATERALE) */
.callout-box {
  margin: 6pt 0 6pt 0;
  padding: 6pt 10pt;
  border-radius: var(--border-radius-sm);
  font-size: var(--font-size-body);
  line-height: 1.45;
  page-break-inside: avoid;
}

.callout-success {
  background-color: var(--color-success-bg);
  color: var(--color-success);
}
.callout-success strong {
  color: var(--color-success);
}

.callout-warning {
  background-color: var(--color-warning-bg);
  color: var(--color-warning);
}
.callout-warning strong {
  color: var(--color-warning);
}

.callout-error {
  background-color: var(--color-error-bg);
  color: var(--color-error);
}
.callout-error strong {
  color: var(--color-error);
}

.callout-info {
  background-color: var(--color-info-bg);
  color: var(--color-info);
}
.callout-info strong {
  color: var(--color-info);
}

/* PREAMBULE ACADEMIQUE */
.abstract-box {
  margin: 12pt 20pt 16pt 20pt;
  padding: 6pt 12pt;
  border-top: 0.5pt solid var(--color-border-light);
  border-bottom: 0.5pt solid var(--color-border-light);
}

.abstract-title {
  font-size: var(--font-size-h3);
  font-weight: bold;
  text-align: center;
  margin-bottom: 4pt;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
}

.abstract-text {
  font-size: var(--font-size-table);
  font-style: italic;
  line-height: 1.35;
  margin: 0;
  text-align: justify;
}

/* BADGES ET METADONNEES EN LIGNE */
.badge {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: var(--font-size-micro);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 1.5pt 5pt;
  border-radius: var(--border-radius-sm);
  vertical-align: middle;
}

.badge-success { background: #DCFCE7; color: var(--color-success); }
.badge-warning { background: #FEF3C7; color: var(--color-warning); }
.badge-brand   { background: #DBEAFE; color: var(--color-brand-primary); }
.badge-neutral { background: #F1F5F9; color: var(--color-text-secondary); }

/* CONTENEURS POUR SCHEMAS ET DIAGRAMMES */
.diagram-container {
  margin: 12pt 0;
  padding: 8pt;
  background: #FFFFFF;
  border: 0.5pt solid var(--color-border-light);
  border-radius: var(--border-radius-md);
  text-align: center;
  page-break-inside: avoid;
}

.diagram-caption {
  font-size: var(--font-size-meta);
  font-style: italic;
  color: var(--color-text-secondary);
  margin-top: 4pt;
  text-align: center;
}

/* ELEMENTS D'EXPRESSION DE CODE ET REFERENCES */
code.latex-code {
  font-family: var(--font-mono);
  font-size: var(--font-size-meta);
  color: var(--color-brand-primary);
  background: transparent;
}

    body {
      max-width: 960px;
      margin: 30px auto;
      padding: 20px;
      background: #F8FAFC;
    }
  </style>
</head>
<body>
  <!-- DIAGRAMMES METHODE APTE : BETE A CORNES & DIAGRAMME PIEUVRE (SVG VECTORIEL PUR) -->
<div class="diagram-container" style="margin: 16pt 0; text-align: center;">

  <!-- 1. BETE A CORNES -->
  <h3 style="font-size: 10pt; color: var(--color-brand-primary); margin-bottom: 8pt; text-transform: uppercase;">
    Figure 1.1 — Enonciation du Besoin Canonique (Bete a Cornes)
  </h3>
  
  <svg viewBox="0 0 700 220" width="100%" height="220" style="font-family: 'Inter', sans-serif;">
    <!-- Bulle 1 : A qui rend-il service ? -->
    <rect x="30" y="20" width="200" height="60" rx="6" fill="#EFF6FF" stroke="#0F2A4A" stroke-width="1.5" />
    <text x="130" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F2A4A">A qui rend-il service ?</text>
    <text x="130" y="60" text-anchor="middle" font-size="9.5" fill="#334155">Citoyens, Commerçants & Collectivite</text>

    <!-- Bulle 2 : Sur quoi agit-il ? -->
    <rect x="470" y="20" width="200" height="60" rx="6" fill="#EFF6FF" stroke="#0F2A4A" stroke-width="1.5" />
    <text x="570" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F2A4A">Sur quoi agit-il ?</text>
    <text x="570" y="60" text-anchor="middle" font-size="9.5" fill="#334155">Flux d achats physiques & Mobilite</text>

    <!-- Centre : Systeme ShopLoc -->
    <rect x="250" y="80" width="200" height="50" rx="8" fill="#0F2A4A" stroke="#0F2A4A" stroke-width="2" />
    <text x="350" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Plateforme ShopLoc</text>
    <text x="350" y="120" text-anchor="middle" font-size="8.5" fill="#CBD5E1">Systeme Multi-Tenant Territorial</text>

    <!-- Bulle 3 : Dans quel but ? -->
    <rect x="180" y="160" width="340" height="50" rx="6" fill="#F0FDF4" stroke="#166534" stroke-width="1.5" />
    <text x="350" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Dans quel but ?</text>
    <text x="350" y="198" text-anchor="middle" font-size="9" fill="#334155">Revitaliser l economie de centre-ville et valoriser la fidelite citoyenne</text>

    <!-- Lignes de liaison -->
    <line x1="130" y1="80" x2="250" y2="105" stroke="#0F2A4A" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="570" y1="80" x2="450" y2="105" stroke="#0F2A4A" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="350" y1="130" x2="350" y2="160" stroke="#166534" stroke-width="1.5" />
  </svg>

  <hr style="border: none; border-top: 0.5pt solid var(--color-border-subtle); margin: 16pt 0;">

  <!-- 2. DIAGRAMME PIEUVRE (FONCTIONS ET CONTRAINTES) -->
  <h3 style="font-size: 10pt; color: var(--color-brand-primary); margin-bottom: 8pt; text-transform: uppercase;">
    Figure 1.2 — Graphe des Interactions & Contraintes (Diagramme Pieuvre APTE)
  </h3>

  <svg viewBox="0 0 700 320" width="100%" height="320" style="font-family: 'Inter', sans-serif;">
    <!-- Acteur 1 : Citoyen Acheteur (Haut Gauche) -->
    <circle cx="120" cy="60" r="45" fill="#F8FAFC" stroke="#0F2A4A" stroke-width="1.5" />
    <text x="120" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#0F2A4A">Citoyen</text>
    <text x="120" y="72" text-anchor="middle" font-size="8.5" fill="#64748B">Acheteur</text>

    <!-- Acteur 2 : Commerçant Partenaire (Haut Droite) -->
    <circle cx="580" cy="60" r="45" fill="#F8FAFC" stroke="#0F2A4A" stroke-width="1.5" />
    <text x="580" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#0F2A4A">Commerçant</text>
    <text x="580" y="72" text-anchor="middle" font-size="8.5" fill="#64748B">Boutique</text>

    <!-- Acteur 3 : Reglementation RGPD & Ethique (Gauche) -->
    <circle cx="80" cy="180" r="40" fill="#FEF2F2" stroke="#991B1B" stroke-width="1.5" />
    <text x="80" y="178" text-anchor="middle" font-size="9" font-weight="bold" fill="#991B1B">RGPD</text>
    <text x="80" y="192" text-anchor="middle" font-size="8" fill="#64748B">Vie Privee</text>

    <!-- Acteur 4 : Collectivite & Mairie (Bas Centre) -->
    <circle cx="350" cy="275" r="40" fill="#F0FDF4" stroke="#166534" stroke-width="1.5" />
    <text x="350" y="272" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">Mairie</text>
    <text x="350" y="286" text-anchor="middle" font-size="8" fill="#64748B">Subvention</text>

    <!-- Acteur 5 : Systemes Partenaires Mobilites (Droite) -->
    <circle cx="620" cy="180" r="40" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.5" />
    <text x="620" y="178" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E40AF">Mobilite</text>
    <text x="620" y="192" text-anchor="middle" font-size="8" fill="#64748B">Bus / Parking</text>

    <!-- Centre : ShopLoc -->
    <rect x="270" y="110" width="160" height="65" rx="8" fill="#0F2A4A" stroke="#0F2A4A" stroke-width="2" />
    <text x="350" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ShopLoc</text>
    <text x="350" y="156" text-anchor="middle" font-size="8.5" fill="#CBD5E1">Cœur Applicatif</text>

    <!-- Ligne FP1 : Traverse Citoyen -> ShopLoc -> Commercant -->
    <path d="M 165 60 Q 350 20 535 60" fill="none" stroke="#166534" stroke-width="2.5" />
    <rect x="300" y="18" width="100" height="20" rx="3" fill="#DCFCE7" stroke="#166534" stroke-width="1" />
    <text x="350" y="32" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#166534">FP1 : Click & Collect + VFP</text>

    <!-- Lignes FC (Contraintes) -->
    <line x1="120" y1="180" x2="270" y2="150" stroke="#991B1B" stroke-width="1.5" />
    <text x="180" y="160" font-size="8" font-weight="bold" fill="#991B1B">FC1 (RGPD)</text>

    <line x1="350" y1="235" x2="350" y2="175" stroke="#166534" stroke-width="1.5" />
    <text x="360" y="210" font-size="8" font-weight="bold" fill="#166534">FC2 (Finances/Convention)</text>

    <line x1="580" y1="180" x2="430" y2="150" stroke="#1E40AF" stroke-width="1.5" />
    <text x="470" y="160" font-size="8" font-weight="bold" fill="#1E40AF">FC3 (Mocks API)</text>

    <!-- FC4 : Accessibilite Senior Pierre -->
    <line x1="150" y1="95" x2="280" y2="120" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="175" y="112" font-size="8" font-weight="bold" fill="#B45309">FC4 (RGAA Senior)</text>
  </svg>
</div>

</body>
</html>
