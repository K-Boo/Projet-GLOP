<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Apercu Composant — apte_pieuvre</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/latin-modern-web@1.0.0/style.css">
  <style>
    /* ==========================================================================
   THEME MAITRE SHOPLOC — IDENTITE VISUELLE NORMALISEE
   Master 2 MIAGE — Universite de Lille — UE GLOP (2026-2027)
   Inspiration Ollca Pastel & Craft — Charte Ergonomique et Zero Emoji
   ========================================================================== */

:root {
  /* 1. PALETTE DE COULEURS PASTEL NATURELLE (INSPIRATION OLLCA & COMMERCE LOCAL) */
  --color-brand-primary: #243342;       /* Bleu ardoise brumeux (Structure & Titres) */
  --color-brand-secondary: #C26750;     /* Terracotta poudree (Chaleur & Artisanat) */
  --color-brand-accent: #4A7A5B;        /* Sauge maraichere (Fraicheur & Terroir) */
  --color-brand-honey: #C48B28;         /* Ocre miel doux (Fidelite & Dynamisme) */
  --color-brand-plum: #6E3946;          /* Bordeaux veloute (Commerces de bouche) */

  /* SURFACES DOUCES & FONDS */
  --color-surface-canvas: #FAF9F6;      /* Lin doux / ecru naturel (Canvas unifie) */
  --color-surface-card: #FFFFFF;        /* Blanc pur pour cartes produits */
  --color-surface-warm: #F5F2EB;        /* Fond chaud secondaire */
  --color-surface-page: #FAF9F6;        /* Fond de page lecture */
  --color-surface-print: #FFFFFF;       /* Fond d impression papier A4 */

  /* TONS PASTEL TRES CLAIRS */
  --color-surface-primary-soft: #EBF0F5;
  --color-surface-terracotta-soft: #FBEEEA;
  --color-surface-sage-soft: #EBF3ED;
  --color-surface-honey-soft: #FEF7EB;
  --color-surface-plum-soft: #F6ECEF;

  /* COULEURS FONCTIONNELLES DOUCES */
  --color-success: #4A7A5B;             /* Sauge */
  --color-success-bg: #EBF3ED;
  --color-warning: #C48B28;             /* Ocre miel */
  --color-warning-bg: #FEF7EB;
  --color-error: #B44C43;               /* Terre de Sienne */
  --color-error-bg: #FDF2F0;
  --color-info: #2B5270;                /* Ardoise douce */
  --color-info-bg: #EBF2F7;

  /* TEXTES & LIGNES */
  --color-text-primary: #1E252D;        /* Encre ardoise (> 14:1 sur lin) */
  --color-text-secondary: #5A6578;      /* Ardoise feutree */
  --color-text-muted: #8C96A5;          /* Ardoise legere */
  --color-border-dark: #243342;         /* Lignes maitresses */
  --color-border-light: #DCD6CD;        /* Lignes de separation */
  --color-border-subtle: #EDE8E1;       /* Lignes decoratives fines */

  /* PALETTE PASTEL SUR-MESURE POUR DIAGRAMMES EDITORIAUX (ANTI-AI SLOP) */
  --diagram-canvas: #FAF9F6;
  --diagram-connector: #8A9BAE;
  
  --diagram-citizen-bg: #FBEEEA;
  --diagram-citizen-border: #D88B77;
  --diagram-citizen-text: #8E3D2A;

  --diagram-merchant-bg: #EBF3ED;
  --diagram-merchant-border: #7EA88D;
  --diagram-merchant-text: #2E583D;

  --diagram-city-bg: #FEF7EB;
  --diagram-city-border: #DCB162;
  --diagram-city-text: #845A11;

  --diagram-system-bg: #EBF0F5;
  --diagram-system-border: #8B9EAF;
  --diagram-system-text: #1C2D3D;

  --diagram-alert-bg: #FDF2F0;
  --diagram-alert-border: #D98880;
  --diagram-alert-text: #8C2E25;

  --diagram-lane-bg: #F5F2EB;
  --diagram-lane-border: #DCD6CD;

  /* 2. TYPOGRAPHIES */
  --font-serif: "Latin Modern Roman", "LM Roman 10", "Computer Modern", "TeX Gyre Termes", "Times New Roman", Times, serif;
  --font-sans: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Fira Code", "Latin Modern Mono", "Consolas", "Courier New", monospace;

  /* 3. ECHELLE DE TAILLES (DOCUMENT A4) */
  --font-size-title-main: 15pt;
  --font-size-wave: 12.5pt;
  --font-size-h2: 11.5pt;
  --font-size-h3: 10pt;
  --font-size-body: 9.5pt;
  --font-size-table: 9pt;
  --font-size-meta: 8.5pt;
  --font-size-micro: 7.5pt;

  /* 4. ESPACEMENTS, BORDURES & OMBRES CRAFT */
  --line-height-normal: 1.42;
  --border-radius-sm: 6px;
  --border-radius-md: 10px;
  --border-radius-lg: 14px;
  --border-radius-pill: 9999px;
  --shadow-soft: 0 2px 8px rgba(36, 51, 66, 0.04);
  --shadow-card: 0 4px 16px rgba(36, 51, 66, 0.06);
}

/* CONFIGURATION DU RENDU IMPRESSION ET PAGE A4 */
@page {
  size: A4 portrait;
  margin: 24mm 20mm 24mm 20mm;

  @top-left {
    content: "Projet ShopLoc — Master 2 MIAGE GLOP";
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    font-style: italic;
    color: var(--color-text-secondary);
    border-bottom: 0.5pt solid var(--color-border-light);
    padding-bottom: 4pt;
    margin-bottom: 8pt;
  }

  @top-right {
    content: "Universite de Lille — FST Informatique";
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    font-style: italic;
    color: var(--color-text-secondary);
    border-bottom: 0.5pt solid var(--color-border-light);
    padding-bottom: 4pt;
    margin-bottom: 8pt;
  }

  @bottom-center {
    content: counter(page);
    font-family: var(--font-serif);
    font-size: var(--font-size-meta);
    color: var(--color-text-primary);
  }
}

@page :first {
  @top-left { content: ""; border-bottom: none; }
  @top-right { content: ""; border-bottom: none; }
  @bottom-center { content: "1"; }
}

/* REGLES GENERALES */
*, *:before, *:after {
  box-sizing: border-box;
}

body {
  font-family: var(--font-serif);
  font-size: var(--font-size-body);
  line-height: var(--line-height-normal);
  color: var(--color-text-primary);
  background: var(--color-surface-print);
  margin: 0;
  padding: 0;
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
}

/* EN-TETE INSTITUTIONNEL AVEC LOGOS OFFICIELS */
.institution-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12pt;
  padding-bottom: 8pt;
  border-bottom: 0.75pt solid var(--color-brand-primary);
}

.institution-logo {
  height: 42px;
  max-width: 210px;
  object-fit: contain;
}

/* TITRAGE MAITRE */
.title-block {
  text-align: center;
  margin-top: 14pt;
  margin-bottom: 18pt;
}

.latex-main-title {
  font-size: var(--font-size-title-main);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
  margin: 0 0 6pt 0;
  line-height: 1.25;
}

.latex-sub-title {
  font-size: 11pt;
  font-style: italic;
  color: var(--color-brand-secondary);
  margin: 0 0 10pt 0;
}

/* BANNIERES DE GRANDES SECTIONS & H2 */
.wave-banner {
  font-size: var(--font-size-wave);
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
  margin-top: 22pt;
  margin-bottom: 10pt;
  padding-bottom: 4pt;
  border-bottom: 1.5pt solid var(--color-brand-primary);
  page-break-after: avoid;
}

h2.section-heading {
  font-size: var(--font-size-h2);
  font-weight: bold;
  color: var(--color-brand-primary);
  margin-top: 16pt;
  margin-bottom: 6pt;
  padding-bottom: 2pt;
  border-bottom: 0.5pt solid var(--color-brand-secondary);
  page-break-after: avoid;
  text-align: left;
}

h3.subsection-heading {
  font-size: var(--font-size-h3);
  font-weight: bold;
  color: var(--color-text-primary);
  margin: 10pt 0 4pt 0;
  page-break-after: avoid;
  text-align: left;
}

/* TABLEAUX ACADEMIQUES FORMAT BOOKTABS */
.table-wrapper {
  margin: 8pt 0 14pt 0;
  width: 100%;
}

table.booktabs {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-table);
  line-height: 1.35;
  border-top: 1.5pt solid var(--color-border-dark);
  border-bottom: 1.5pt solid var(--color-border-dark);
  margin-bottom: 6pt;
}

table.booktabs th {
  font-weight: bold;
  text-align: left;
  padding: 5pt 7pt;
  border-bottom: 0.75pt solid var(--color-border-dark);
  background: transparent;
  color: var(--color-brand-primary);
}

table.booktabs td {
  padding: 4.5pt 7pt;
  vertical-align: top;
  border-bottom: 0.3pt solid var(--color-border-light);
  background: transparent;
}

table.booktabs tr:last-child td {
  border-bottom: none;
}

table.booktabs code {
  font-family: var(--font-mono);
  font-size: var(--font-size-meta);
  color: var(--color-brand-primary);
}

/* CARTOUCHE D'IDENTIFICATION OFFICIEL GLOP */
.cartouche-container {
  margin: 10pt 0 14pt 0;
}

.cartouche-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-table);
  border-top: 1.5pt solid var(--color-brand-primary);
  border-bottom: 1.5pt solid var(--color-brand-primary);
}

.cartouche-table th {
  width: 32%;
  padding: 4pt 6pt;
  text-align: left;
  font-weight: bold;
  color: var(--color-brand-primary);
  border-bottom: 0.5pt solid var(--color-border-light);
}

.cartouche-table td {
  width: 68%;
  padding: 4pt 6pt;
  border-bottom: 0.3pt solid var(--color-border-light);
}

.cartouche-table tr:last-child th,
.cartouche-table tr:last-child td {
  border-bottom: none;
}

/* ENCARTS ET DECISIONS VALIDATION / ATTENTE (ZERO BARRE LATERALE) */
.callout-box {
  margin: 6pt 0 6pt 0;
  padding: 6pt 10pt;
  border-radius: var(--border-radius-sm);
  font-size: var(--font-size-body);
  line-height: 1.45;
  page-break-inside: avoid;
}

.callout-success {
  background-color: var(--color-success-bg);
  color: var(--color-success);
}
.callout-success strong {
  color: var(--color-success);
}

.callout-warning {
  background-color: var(--color-warning-bg);
  color: var(--color-warning);
}
.callout-warning strong {
  color: var(--color-warning);
}

.callout-error {
  background-color: var(--color-error-bg);
  color: var(--color-error);
}
.callout-error strong {
  color: var(--color-error);
}

.callout-info {
  background-color: var(--color-info-bg);
  color: var(--color-info);
}
.callout-info strong {
  color: var(--color-info);
}

/* PREAMBULE ACADEMIQUE */
.abstract-box {
  margin: 12pt 20pt 16pt 20pt;
  padding: 6pt 12pt;
  border-top: 0.5pt solid var(--color-border-light);
  border-bottom: 0.5pt solid var(--color-border-light);
}

.abstract-title {
  font-size: var(--font-size-h3);
  font-weight: bold;
  text-align: center;
  margin-bottom: 4pt;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-brand-primary);
}

.abstract-text {
  font-size: var(--font-size-table);
  font-style: italic;
  line-height: 1.35;
  margin: 0;
  text-align: justify;
}

/* BADGES ET METADONNEES EN LIGNE */
.badge {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: var(--font-size-micro);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 1.5pt 5pt;
  border-radius: var(--border-radius-sm);
  vertical-align: middle;
}

.badge-success { background: #DCFCE7; color: var(--color-success); }
.badge-warning { background: #FEF3C7; color: var(--color-warning); }
.badge-brand   { background: #DBEAFE; color: var(--color-brand-primary); }
.badge-neutral { background: #F1F5F9; color: var(--color-text-secondary); }

/* CONTENEURS POUR SCHEMAS ET DIAGRAMMES */
.diagram-container {
  margin: 12pt 0;
  padding: 8pt;
  background: #FFFFFF;
  border: 0.5pt solid var(--color-border-light);
  border-radius: var(--border-radius-md);
  text-align: center;
  page-break-inside: avoid;
}

.diagram-caption {
  font-size: var(--font-size-meta);
  font-style: italic;
  color: var(--color-text-secondary);
  margin-top: 4pt;
  text-align: center;
}

/* ELEMENTS D'EXPRESSION DE CODE ET REFERENCES */
code.latex-code {
  font-family: var(--font-mono);
  font-size: var(--font-size-meta);
  color: var(--color-brand-primary);
  background: transparent;
}

    body {
      max-width: 960px;
      margin: 30px auto;
      padding: 20px;
      background: #F8FAFC;
    }
  </style>
</head>
<body>
  <!-- DIAGRAMMES METHODE APTE : BETE A CORNES & DIAGRAMME PIEUVRE (NORMES AFNOR NF X 50-151) -->
<!-- Design Editorial Craft & Pastel — Inspiration Ollca & Sobriete GLOP (Zero Emoji) -->

<div class="diagram-container" style="margin: 24pt 0; text-align: center; background: #FAF9F6; border: 1px solid #DCD6CD; border-radius: 18px; padding: 22pt 18pt; box-shadow: 0 6px 24px rgba(36, 51, 66, 0.05);">

  <!-- ========================================================================= -->
  <!-- 1. ENONCIATION DU BESOIN CANONIQUE (BETE A CORNES)                       -->
  <!-- ========================================================================= -->
  <div style="display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16pt;">
    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #C26750;"></span>
    <h3 style="font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 11pt; font-weight: 700; color: #243342; margin: 0; text-transform: uppercase; letter-spacing: 0.08em;">
      Figure 1.1 — Enonciation du Besoin Canonique (Methode APTE — Bete a Cornes)
    </h3>
  </div>
  
  <svg viewBox="0 0 760 270" width="100%" height="270" style="font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; overflow: visible;">
    <defs>
      <filter id="craft-card-shadow" x="-5%" y="-10%" width="110%" height="125%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#243342" flood-opacity="0.06" />
      </filter>
      <marker id="arrow-craft-subtle" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4A7A5B" />
      </marker>
    </defs>

    <!-- Courbes de liaison douces (Beziers cubiques elegantes avec noeuds) -->
    <path d="M 180 100 C 180 135, 290 148, 290 148" fill="none" stroke="#8A9BAE" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 580 100 C 580 135, 470 148, 470 148" fill="none" stroke="#8A9BAE" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Noeuds de contact circulaires -->
    <circle cx="180" cy="100" r="3.5" fill="#C26750" />
    <circle cx="580" cy="100" r="3.5" fill="#4A7A5B" />

    <!-- Fleche vers le but final -->
    <path d="M 380 180 L 380 205" fill="none" stroke="#4A7A5B" stroke-width="2" marker-end="url(#arrow-craft-subtle)" />

    <!-- CARTE 1 : A qui rend-il service ? (Terracotta Pastel Scripte) -->
    <g filter="url(#craft-card-shadow)">
      <rect x="50" y="15" width="260" height="85" rx="16" fill="#FBEEEA" stroke="#D88B77" stroke-width="1.2" />

      <text x="68" y="64" font-size="11" font-weight="700" fill="#243342">A qui rend-il service ?</text>

    <!-- CARTE 2 : Sur quoi agit-il ? (Sauge Pastel Maraichere) -->
    <g filter="url(#craft-card-shadow)">
      <rect x="450" y="15" width="260" height="85" rx="16" fill="#EBF3ED" stroke="#7EA88D" stroke-width="1.2" />
      <!-- Pastille Pilule de Classification -->
      <rect x="468" y="27" width="118" height="18" rx="9" fill="#D9E9DD" />

    <!-- CARTE CENTRALE : Systeme ShopLoc (Ardoise Brumeux & Sceau Noble) -->
    <g filter="url(#craft-card-shadow)">
      <rect x="260" y="115" width="240" height="66" rx="16" fill="#243342" stroke="#243342" stroke-width="1.2" />

      <text x="380" y="136.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#DCD6CD" letter-spacing="0.08em">SYSTEME CIBLE</text>
      
      <text x="380" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#FAF9F6">Plateforme ShopLoc</text>
      <text x="380" y="171" text-anchor="middle" font-size="8" fill="#8B9EAF">Ecosysteme Territorial Multi-Acteurs</text>
    </g>

      <text x="380" y="244" text-anchor="middle" font-size="8.5" fill="#5A6578">Revitaliser l economie de proximite et federer la fidelite citoyenne en centre-ville</text>
    </g>
  </svg>


  <!-- ========================================================================= -->
  <!-- 2. DIAGRAMME DES INTERACTEURS (DIAGRAMME PIEUVRE)                         -->
  <!-- ========================================================================= -->
  <div style="border-top: 1px solid #EDE8E1; margin: 24pt 0 16pt 0; padding-top: 20pt;">
    <div style="display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16pt;">
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4A7A5B;"></span>

      </h3>
    </div>
  </div>

  <svg viewBox="0 0 860 420" width="100%" height="420" style="font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; overflow: visible;">
    
    <!-- LIAISONS FP (FONCTIONS PRINCIPALES) — COURBES TRAVERSANTES DOUCES -->

    <path d="M 170 80 C 300 30, 560 30, 690 80" fill="none" stroke="#C26750" stroke-width="2.5" />

    <path d="M 690 80 L 490 200" fill="none" stroke="#8A9BAE" stroke-width="1.75" stroke-dasharray="4,4" />
    <rect x="585" y="130" width="105" height="22" rx="11" fill="#FFFFFF" stroke="#8A9BAE" stroke-width="1" />
    <text x="637" y="145" text-anchor="middle" font-size="7.5" font-weight="600" fill="#243342">FC1 : Caisse & Stocks</text>

    <!-- FC2 : Mairie vers ShopLoc -->
    <path d="M 260 340 L 370 240" fill="none" stroke="#8A9BAE" stroke-width="1.75" stroke-dasharray="4,4" />
    <rect x="250" y="275" width="110" height="22" rx="11" fill="#FFFFFF" stroke="#8A9BAE" stroke-width="1" />
    <text x="305" y="290" text-anchor="middle" font-size="7.5" font-weight="600" fill="#243342">FC2 : Souverainete RGPD</text>

    <!-- FC3 : Banques / Paiement vers ShopLoc -->
    <path d="M 600 340 L 470 240" fill="none" stroke="#8A9BAE" stroke-width="1.75" stroke-dasharray="4,4" />
    <rect x="520" y="275" width="105" height="22" rx="11" fill="#FFFFFF" stroke="#8A9BAE" stroke-width="1" />
    <text x="572" y="290" text-anchor="middle" font-size="7.5" font-weight="600" fill="#243342">FC3 : Flux Securises</text>

    <!-- NOEUDS ENVIRONNEMENT EXTERIEUR (CARTES SCULPTEES) -->

    <!-- Noeud 1 : Citoyens & Consommateurs (Haut Gauche) -->
    <g transform="translate(80, 45)" filter="url(#craft-card-shadow)">
