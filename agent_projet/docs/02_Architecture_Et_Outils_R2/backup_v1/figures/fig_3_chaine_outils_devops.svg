  <text x="854" y="211" fill="#15803D" font-size="10.5" font-weight="600">4 vCPU, 8 Go RAM, 50 Go NVMe</text>
  <text x="854" y="227" fill="#64748B" font-size="10">Cout fixe maitrise (~10-15 €/mois)</text>

