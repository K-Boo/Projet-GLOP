<!-- GABARIT DE REFERENCE BPMN 2.0 A COULOIRS (SWIMLANES) EN SVG VECTORIEL PUR -->
<!-- Palette pastel adoucie conformement a l arbitrage de session -->

<div class="diagram-container" style="margin: 16pt 0; text-align: center;">
  <h3 style="font-size: 10.5pt; color: var(--color-brand-primary); margin-bottom: 8pt; text-transform: uppercase;">
    Figure 3.1 — Processus BPMN 2.0 : Commande Click & Collect et Retrait Magasin (Processus P2)
  </h3>

  <svg viewBox="0 0 920 460" width="100%" height="460" style="font-family: 'Inter', sans-serif;">
    <!-- DEFINITION DES MARQUEURS DE FLECHES -->
    <defs>
      <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
      </marker>
      <marker id="arrow-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
      </marker>
    </defs>

    <!-- CADRE GENERAL DU PROCESSUS (POOL SHOPLOC) -->
    <rect x="20" y="20" width="880" height="420" fill="#FFFFFF" stroke="#0F2A4A" stroke-width="1.5" />
    
    <!-- EN-TETE DU POOL -->
    <rect x="20" y="20" width="35" height="420" fill="#0F2A4A" />
    <text x="38" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" transform="rotate(-90 38 230)">
      PROCESSUS DE COMMANDE & RETRAIT CLICK & COLLECT
    </text>

    <!-- COULOIR 1 : CITOYEN / CLIENT (Vert pastel) -->
    <rect x="55" y="20" width="845" height="100" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75" />
    <rect x="55" y="20" width="120" height="100" fill="#DCFCE7" opacity="0.4" />
    <text x="65" y="75" font-size="10" font-weight="bold" fill="#15803D">1. Citoyen (Client)</text>

    <!-- COULOIR 2 : COEUR SHOPLOC (Bleu pastel) -->
    <rect x="55" y="120" width="845" height="110" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.75" />
    <rect x="55" y="120" width="120" height="110" fill="#E0F2FE" opacity="0.4" />
    <text x="65" y="180" font-size="10" font-weight="bold" fill="#0369A1">2. Plateforme ShopLoc</text>

    <!-- COULOIR 3 : COMMERCANT (Peche pastel) -->
    <rect x="55" y="230" width="845" height="105" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75" />
    <rect x="55" y="230" width="120" height="105" fill="#FFEDD5" opacity="0.4" />
    <text x="65" y="290" font-size="10" font-weight="bold" fill="#C2410C">3. Commerçant</text>

    <!-- COULOIR 4 : SERVICES PARTENAIRES (Lavande pastel) -->
    <rect x="55" y="335" width="845" height="105" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.75" />
    <rect x="55" y="335" width="120" height="105" fill="#EDE9FE" opacity="0.4" />
    <text x="65" y="395" font-size="10" font-weight="bold" fill="#6D28D9">4. Services Partenaires</text>

    <!-- FLUX BPMN 2.0 : ETAPES ET ACTIVITES -->

    <!-- Evenement Debut (Cercle fin vert pastel) -->
    <circle cx="205" cy="70" r="16" fill="#DCFCE7" stroke="#15803D" stroke-width="2" />
    <text x="205" y="100" text-anchor="middle" font-size="7.5" fill="#15803D">Panier valide</text>

    <!-- Sequence Citoyen -> ShopLoc -->
    <line x1="221" y1="70" x2="260" y2="70" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-solid)" />

    <!-- Tache 1 (Citoyen) : Choix du creneau de retrait -->
    <rect x="260" y="45" width="115" height="50" rx="6" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.2" />
    <text x="317" y="66" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803D">Selectionner les</text>
    <text x="317" y="80" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803D">creneaux de retrait</text>

    <!-- Ligne de sequence vers ShopLoc -->
    <path d="M 375 70 L 400 70 L 400 150 L 420 150" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-solid)" />

    <!-- Tache 2 (ShopLoc) : Reservation temporaire stock (2PC) -->
    <rect x="420" y="130" width="120" height="50" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2" />
    <text x="480" y="151" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0369A1">Verrouiller stock</text>
    <text x="480" y="165" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0369A1">& creer commande</text>

    <!-- Passerelle XOR : Stock disponible ? -->
    <polygon points="580,155 600,135 620,155 600,175" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
    <text x="600" y="159" text-anchor="middle" font-size="10" font-weight="bold" fill="#B45309">X</text>
    <line x1="540" y1="155" x2="580" y2="155" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-solid)" />

    <!-- Branche Rejet (Haut / Droite) : Rupture de stock -->
    <path d="M 600 135 L 600 70 L 680 70" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-solid)" />
    <text x="635" y="63" font-size="7.5" font-weight="bold" fill="#DC2626">[Stock epuise]</text>
    <rect x="680" y="45" width="105" height="50" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2" />
    <text x="732" y="66" text-anchor="middle" font-size="8" font-weight="600" fill="#B91C1C">Notifier client</text>
    <text x="732" y="80" text-anchor="middle" font-size="8" font-weight="600" fill="#B91C1C">& liberer panier</text>
    <!-- Fin Rejet -->
    <circle cx="830" cy="70" r="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3" />
    <line x1="785" y1="70" x2="816" y2="70" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-solid)" />

    <!-- Branche OK : Descente vers Commercant -->
    <path d="M 600 175 L 600 280 L 630 280" fill="none" stroke="#166534" stroke-width="1.5" marker-end="url(#arrow-solid)" />
    <text x="608" y="225" font-size="7.5" font-weight="bold" fill="#166534">[Disponible]</text>

    <!-- Tache 3 (Commercant) : Preparation paquet & Scan QR retrait -->
    <rect x="630" y="255" width="125" height="50" rx="6" fill="#FFEDD5" stroke="#F97316" stroke-width="1.2" />
    <text x="692" y="276" text-anchor="middle" font-size="8.5" font-weight="600" fill="#C2410C">Preparer commande</text>
    <text x="692" y="290" text-anchor="middle" font-size="8.5" font-weight="600" fill="#C2410C">& scanner retrait</text>

    <!-- Notification vers Services Mobilites (Descente vers Couloir 4) -->
    <path d="M 692 305 L 692 385 L 720 385" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-msg)" />

    <!-- Tache 4 (Services Partenaires) : Crediter passage VFP et verifier seuil mobilite -->
    <rect x="720" y="360" width="120" height="50" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2" />
    <text x="780" y="381" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6D28D9">Incrementer VFP</text>
    <text x="780" y="395" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6D28D9">& mock transport</text>

    <!-- Fin Nominale (Cercle epais vert) -->
    <circle cx="875" cy="385" r="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3" />
    <line x1="840" y1="385" x2="861" y2="385" stroke="#15803D" stroke-width="1.5" marker-end="url(#arrow-solid)" />
  </svg>
</div>
